# Default model prices, in USD per million tokens, copied from each provider's
# own pricing page (sources below). Prices change: override or extend them in
# costless.yaml under `pricing.models`, or point `pricing.file` at your own table.
version: 1
currency: USD
models:
  # Anthropic. Source: https://platform.claude.com/docs/en/about-claude/pricing
  # (retrieved 2026-10-01). Standard first-party rates. Not modelled: batch
  # discount, fast mode, inference_geo multiplier, and 1-hour cache writes
  # (cache_write is the 5-minute rate).
  claude-fable-5-1:  {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50}
  claude-fable-5:    {input: 10.00, output: 50.00, cache_read: 1.00, cache_write: 12.50}
  claude-opus-5-5:   {input: 4.00,  output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-opus-5:     {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-8:   {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-7:   {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-6:   {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-5:   {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-sonnet-5-5: {input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-sonnet-5:   {input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-sonnet-4-6: {input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75}
  claude-sonnet-4-5: {input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75}
  claude-haiku-4-5:  {input: 1.00,  output: 5.00,  cache_read: 0.10, cache_write: 1.25}

  # xAI. Source: https://docs.x.ai/developers/pricing (retrieved 2026-10-01).
  # Standard tier (< 200k prompt tokens); xAI bills the whole request at the
  # long-context rate above that, which is not modelled. xAI has no separate
  # cache-write price, so cache_write is left to default to the input price.
  grok-4.7:                     {input: 2.00, output: 6.00, cache_read: 0.50}
  grok-4.6:                     {input: 2.00, output: 6.00, cache_read: 0.50}
  grok-4.5:                     {input: 2.00, output: 6.00, cache_read: 0.30}
  grok-4.3:                     {input: 1.25, output: 2.50, cache_read: 0.20}
  grok-4.20-0309-reasoning:     {input: 1.25, output: 2.50, cache_read: 0.20}
  grok-4.20-0309-non-reasoning: {input: 1.25, output: 2.50, cache_read: 0.20}
  grok-4.20-multi-agent-0309:   {input: 1.25, output: 2.50, cache_read: 0.20}
  grok-build-0.1:               {input: 1.00, output: 2.00, cache_read: 0.20}
